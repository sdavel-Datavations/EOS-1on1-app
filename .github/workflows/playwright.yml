name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # tests/e2e.spec.ts is deliberately excluded. It signs real accounts in and
      # out of the live Supabase project, so running it here would mean holding the
      # service-role key in GitHub and writing to production on every push. It runs
      # locally before a push instead. Everything else is pure functions: no
      # browser, no network, no credentials — which is why there is no
      # `playwright install` step. Add one if a browser test ever joins this set.
      - name: Run the logic suite
        run: npx playwright test --reporter=github $(ls tests/*.spec.ts | grep -v e2e)
